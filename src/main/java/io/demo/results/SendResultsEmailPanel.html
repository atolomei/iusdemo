<wicket:panel>

	<div class="w-100 border rounded bg-body-tertiary p-3 mb-3" wicket:id="sendEmailContainer">

		<!-- form -->
		<div wicket:id="sendEmailFormContainer">

			<div class="row">
				<div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12">
					<h3 style="font-size: 1em; font-weight: bold; text-transform: uppercase;">Enviar por email</h3>
				</div>
			</div>

			<form wicket:id="sendEmailForm">
				<!-- div class="mb-3">
					<label class="form-label" style="text-transform: uppercase; font-weight: bold; font-size: 0.9em;">Enviado por</label>
					<div class="form-control-plaintext ps-0" style="font-size: 0.92em;" wicket:id="sentBy"></div>
				</div -->

				<div class="mt-3 mb-3">
					<label class="form-label" style="text-transform: uppercase; font-weight: bold; font-size: 0.9em;">Enviar a </label>
					<input wicket:id="to" type="email" class="form-control" style="font-size: 0.92em;" placeholder="nombre@dominio.com" />
				</div>

				<div class="mt-3 mb-3">
					<label class="form-label" style="text-transform: uppercase; font-weight: bold; font-size: 0.9em;">Comentarios</label>
					<textarea wicket:id="comments" class="form-control" style="font-size: 0.92em;" rows="3"></textarea>
				</div>

				<button wicket:id="send" type="submit" class="btn btn-outline-primary btn-sm me-2"><i class="fa-solid fa-envelope me-1"></i>Enviar</button>
				<a wicket:id="cancel" class="btn btn-outline-secondary btn-sm">Cancelar</a>
			</form>

			<div class="alert alert-danger mt-2 mb-0" wicket:id="error"></div>

		</div>

		<!-- success -->
		<div wicket:id="sendEmailSuccessContainer">
			<div class="alert alert-success mb-2">
				<span wicket:id="message"></span>
			</div>
			<a wicket:id="close" class="btn btn-outline-secondary btn-sm">Cerrar</a>
		</div>

	</div>

</wicket:panel>
