
<wicket:panel>

	<div class="w-100 border rounded bg-body-tertiary p-3 mb-3">

		<div class="row">
			<div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12">
				<h3 wicket:id="title" style="font-size: 1em; font-weight: bold; text-transform: uppercase;">Análisis General</h3>
			</div>
		</div>

		<div class="row">
			<div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12">
				<div wicket:id="analysis" class="mb-2"></div>
			</div>
		</div>

		<div class="row">
			<div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12">
				<span class="small text-muted">LLM: <span wicket:id="llm"></span></span>
			</div>
		</div>

		<div class="row">
			<div class="mt-2 mb-2 col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12">
				<a wicket:id="close" class="small float-start" href="#">cerrar</a>
			</div>
		</div>



	</div>

</wicket:panel>
