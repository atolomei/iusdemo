<wicket:panel>
	<form wicket:id="searchForm" class="mb-4">
		<fieldset>

			 

			<div class="row">
				<div class="mt-2 col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12 mb-2">
					<h3>
						<wicket:message key="search" />
					</h3>
				</div>
			</div>

			<div class="mb-4" wicket:id="text"></div>
			<div style="float: left; width: 100%;" class="mb-4 mt-3 mr-0" wicket:id="send"></div>
		</fieldset>
	</form>

	
	<div class="mt-2 mb-2" wicket:id="success"></div>
	<div class="mt-2 mb-2" wicket:id="error"></div>
 
</wicket:panel>
