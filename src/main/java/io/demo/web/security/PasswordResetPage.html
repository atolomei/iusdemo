<!DOCTYPE html>
<html xmlns:wicket="http://wicket.apache.org">
<body>
	<wicket:extend>

		<div class="container-fluid login">

			<div class="row">
				<div class="d-block mt-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12"
					style="position: relative; height: 100vh;">

					<div class="mt-0 w-100 ps-4 pe-4"
						style="position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); display: inline-block; background: inherit;">

						<div class="row">
							<div style="margin-bottom: 1em;" class="text-center col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
								<img
									style="padding: 1.5em 2.3em 1em 2.4em; background: none; border-radius: 6px; height: 220px; max-height: 32vh; max-width: 90%;"
									wicket:id="miniLogo" />
							</div>
						</div>

						<div class="row">
							<div class="text-center mt-4 ps-4 pe-4 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
								<div class="w-100 ps-4 pe-4 mb-1">
									<div class="w-100 mb-0">
										<b> <span style="font-size: 1.2em; line-height: 1em; margin: 0;"> <wicket:message key="brand" /></span>
										</b>
									</div>
								</div>
							</div>
						</div>

						<div class="row">
							<div class="text-center mt-0 ps-4 pe-4 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
								<div class="w-100 ps-4 pe-4 mb-4">
									<div class="w-100 mb-0">
										<b> <span style="font-size: 1.15em; line-height: 1em; margin: 0;"> <wicket:message key="app" /> </span>
										</b>
									</div>
								</div>
							</div>
						</div>

						<div class="row">
							<div class="text-center mt-0 ps-4 pe-4 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
								<div class="w-100 ps-4 pe-4 mb-2">
									<div class="w-100 mb-0">
										<h1 style="font-size: 1.4em;">
											<wicket:message key="password-reset" />
										</h1>
									</div>
								</div>
							</div>
						</div>

						<div class="row justify-content-center">
							<div class="mt-0 mb-2 text-center col-md-6 col-sm-12">
								<div style="margin-left: auto; margin-right: auto; float: none; max-width: 400px;" wicket:id="error"></div>
							</div>
						</div>

						<div class="row justify-content-center">
							<div class="mt-0 mb-5 text-center col-md-6 col-sm-12">
								<div style="margin-left: auto; margin-right: auto; float: none; max-width: 400px;" wicket:id="editor"></div>
							</div>
						</div>

					</div>
				</div>
			</div>
		</div>

	</wicket:extend>
</body>
</html>
