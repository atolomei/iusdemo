<wicket:panel>

	<div class="row">
		<div class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
			<div class="bg-light border rounded p-3">


				<div class="row mb-1">
					<div class="col-3"><strong>Usuario</strong></div>
					<div class="col-9"><span wicket:id="user"></span></div>
				</div>

				<div class="row mb-1">
					<div class="col-3"><strong>Fecha</strong></div>
					<div class="col-9"><span wicket:id="date"></span></div>
				</div>

				<div class="row mb-1">
					<div class="col-3"><strong>Consulta</strong></div>
					<div class="col-9"><span wicket:id="query"></span></div>
				</div>

			<div class="row mb-1">
					<div class="col-3"><strong>id</strong></div>
					<div class="col-9"><span wicket:id="id"></span></div>
				</div>


				<div class="row mb-1">
					<div class="col-3"><strong>Calificación</strong></div>
					<div class="col-9"><span wicket:id="grade"></span></div>
				</div>

				<div class="row mb-1">
					<div class="col-3"><strong>Comentario</strong></div>
					<div class="col-9"><span wicket:id="info"></span></div>
				</div>

			</div>
		</div>
	</div>

</wicket:panel>
