<wicket:panel>

	<div class="mt-1 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 text-lg-start text-md-start text-xs-center">

		<div class="row">
			<div class="mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="id" /></b>
			</div>
		</div>
		<div class="row">
			<div class="mt-0 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<span wicket:id="id"></span>
			</div>
		</div>

		<div class="row">
			<div class="mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="query" /></b>
			</div>
		</div>
		<div class="row">
			<div class="mt-0 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<span wicket:id="query"></span>
			</div>
		</div>

		<div class="row">
			<div class="mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="duration" /></b>
			</div>
		</div>
		<div class="row">
			<div class="mt-0 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<span wicket:id="duration"></span>
			</div>
		</div>

		<div class="row">
			<div class="mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="last-modified" /></b>
			</div>
		</div>
		<div class="row">
			<div class="mt-0 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<span wicket:id="lastModified"></span>
			</div>
		</div>

		<div class="row">
			<div class="mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="user" /></b>
			</div>
		</div>
	
		<div class="row">
			<div class="mt-0 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<span wicket:id="user"></span>
			</div>
		</div>



		<div class="row">
			<div class="mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="dateRange" /></b>
			</div>
		</div>


		<div class="row">
			<div class="mt-0 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<span wicket:id="dateRange"></span>
			</div>
		</div>
	
	
	
		<div class="row">
			<div class="mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="subject" /></b>
			</div>
		</div>


		<div class="row">
			<div class="mt-0 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<span wicket:id="subject"></span>
			</div>
		</div>
		


		<div class="row">
			<div class="mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="reasoningEffort" /></b>
			</div>
		</div>


		<div class="row">
			<div class="mt-0 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<span wicket:id="reasoningEffort"></span>
			</div>
		</div>

		
	
		<div class="row">
			<div class="mt-3 mb-3 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<a wicket:id="resultsLink" target="_blank"><wicket:message key="open-results" /></a>
			</div>
		</div>

	</div>

</wicket:panel>
