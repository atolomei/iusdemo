<wicket:panel>

	<div class="mt-1 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 text-lg-start text-md-start text-xs-center">

		<div class="row">
			<div class="mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="name" /></b>
			</div>
		</div>
		<div class="row">
			<div class="mt-0 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<span wicket:id="name"></span>
			</div>
		</div>

		<div class="row">
			<div class="mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="username" /></b>
			</div>
		</div>
		<div class="row">
			<div class="mt-0 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<span wicket:id="username"></span>
			</div>
		</div>

		<div class="row">
			<div class="mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="email" /></b>
			</div>
		</div>
		<div class="row">
			<div class="mt-0 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<span wicket:id="email"></span>
			</div>
		</div>

		<div class="row">
			<div class="mt-3 mb-0 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="phone" /></b>
			</div>
		</div>
		<div class="row">
			<div class="mt-0 mb-1 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<span wicket:id="phone"></span>
			</div>
		</div>

		<div class="row">
			<div class="mt-3 mb-3 col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12">
				<b><wicket:message key="role" /></b>&nbsp;<span wicket:id="role"></span>
			</div>
		</div>

	</div>

</wicket:panel>
