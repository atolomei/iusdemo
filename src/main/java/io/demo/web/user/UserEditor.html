<wicket:panel>

	<form wicket:id="userForm">
		<fieldset>
			<div class="mb-4" wicket:id="firstName"></div>
			<div class="mb-4" wicket:id="lastName"></div>
			<div class="mb-4" wicket:id="username"></div>
			<div class="mb-4" wicket:id="email"></div>
			<div class="mb-4" wicket:id="phone"></div>
			<div class="mb-4" wicket:id="role"></div>
			<div style="float: left; width: 100%;" class="mb-3 mt-3 mr-0" wicket:id="buttons"></div>
		</fieldset>
	</form>

	<div class="mt-2 mb-2" wicket:id="error"></div>

</wicket:panel>
