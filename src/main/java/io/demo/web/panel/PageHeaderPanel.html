<wicket:panel>

	<section id="page-header">

		<div class="row">
			<div class="col-xs-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 col-xxl-12">
				<div class="mb-3 mt-2 ps-4" wicket:id="breadcrumb"></div>
			</div>
		</div>


		<div class="container-xxl">


			<div class="row mt-3">
				<div class="col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
					<h1 style="text-transform: uppercase; margin: 0;">
						<span wicket:id="title"></span>
					</h1>
				</div>
			</div>

			<div class="row mt-1" wicket:id="taglineContainer">
				<div class="tagline col-xxl-12 col-xl-12 col-lg-12 col-md-12 col-sm-12 col-xs-12">
					<span wicket:id="tagline"></span>
				</div>
			</div>
		</div>

	</section>

</wicket:panel>
